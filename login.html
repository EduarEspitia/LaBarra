<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | La Barra</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <section class="login-page">
    <div class="overlay"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="login-box">
      <span class="login-tag">Acceso al sistema</span>

      <h1>LA BARRA</h1>
      <h2>Iniciar sesión</h2>

      <p>
        Accede a la plataforma para gestionar ventas, inventario,
        bodega y productos de manera moderna, organizada y profesional.
      </p>

      <form class="login-form" action="dashboard.html">
        <div class="input-group">
          <label for="usuario">Usuario o correo</label>
          <input
            type="text"
            id="usuario"
            name="usuario"
            placeholder="Ingresa tu usuario o correo"
            required
          >
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Ingresa tu contraseña"
            required
          >
        </div>

        <button type="submit" class="btn-login">Ingresar</button>
      </form>

      <a href="index.html" class="back-link">Volver al inicio</a>
    </div>
  </section>

</body>
</html>
